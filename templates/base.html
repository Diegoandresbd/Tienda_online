<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Glamour Beauty{% endblock %}</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Fuente limpia y moderna (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; color: #333; }
        /* Navbar minimalista */
        .navbar { background-color: #ffffff; border-bottom: 1px solid #eaeaea; }
        .navbar-brand { font-weight: 600; letter-spacing: 1px; }
        .nav-link { font-weight: 400; color: #555 !important; transition: color 0.3s; }
        .nav-link:hover { color: #000 !important; }
        /* Botones personalizados */
        .btn-dark { background-color: #000; border: none; border-radius: 0; }
        .btn-dark:hover { background-color: #333; }
        .btn-outline-dark { border-radius: 0; }
        /* Tarjetas de producto */
        .product-card { border: none; background: transparent; transition: transform 0.3s; }
        .product-card:hover { transform: translateY(-5px); }
        .product-img { height: 300px; object-fit: cover; background-color: #f0f0f0; }
    </style>
</head>
<body>

    <!-- Barra de Navegación Minimalista -->
    <nav class="navbar navbar-expand-lg sticky-top py-3">
        <div class="container">
            <a class="navbar-brand" href="/">GLAMOUR BEAUTY</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/productos">Tienda</a></li>
                    <li class="nav-item"><a class="nav-link" href="/registro">Registro</a></li>
                    <li class="nav-item"><a class="nav-link" href="/historial">Mis Compras</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('servicios') }}">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin" style="color: #d63384 !important;">Admin</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido dinámico de cada página -->
    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center py-5 mt-5 border-top">
        <p class="text-muted small mb-0">&copy; 2024 Glamour Beauty - Proyecto Docker</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
